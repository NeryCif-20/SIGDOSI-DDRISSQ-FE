              <path d="M-21 -26 V26 M0 0 H-38" stroke="#5ee0ff" stroke-opacity="0.35"
                stroke-width="1" fill="none" />
            </g>
          </g>
        </g>
        <g transform="translate(-58 2)">
          <path class="spark" d="M0 -3 L-3 -12" stroke="#ffc857" stroke-width="1.6"
