<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="321 57 256 147" width="256" height="147" role="img"
  aria-label="Un satélite averiado a la deriva, con un panel solar roto, chispas y humo, con un panel solar completo y el otro partido por la mitad."
  xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .wobble { transform-origin: 0 0; animation: wobble 7s ease-in-out infinite; }
    @keyframes wobble { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .dangle { transform-origin: 0 0; animation: dangle 4.5s ease-in-out infinite; }
    @keyframes dangle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
    .spark { opacity: 0; animation: flash 1.5s linear infinite; }
    .spark.sb { animation-delay: 0.5s; }
    .spark.sc { animation-delay: 1s; }
    @keyframes flash { 0% { opacity: 1; } 10% { opacity: 0.2; } 20% { opacity: 1; } 32%, 100% { opacity: 0; } }
    .puff { transform-box: fill-box; transform-origin: center; animation: puff 4.5s ease-out infinite; opacity: 0; }
    .puff.p2 { animation-delay: 1.5s; }
    .puff.p3 { animation-delay: 3s; }
    @keyframes puff { 0% { transform: translate(0,0) scale(0.6); opacity: 0; } 20% { opacity: 0.55; } 100% { transform: translate(8px,-42px) scale(1.9); opacity: 0; } }
    .blink { animation: blink 1.6s steps(2, end) infinite; }
    @keyframes blink { 50% { opacity: 0.15; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    .ping.p2 { animation-delay: 1.2s; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(4); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fd" />
      <stop offset="1" stop-color="#bcc7de" />
    </linearGradient>
    <radialGradient id="helm" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c3cde2" />
    </radialGradient>
    <radialGradient id="visor" cx="0.3" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#3f63d6" />
      <stop offset="0.6" stop-color="#0f1a4a" />
      <stop offset="1" stop-color="#060a1f" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f63d6" />
      <stop offset="0.5" stop-color="#1e2a63" />
      <stop offset="1" stop-color="#0a1030" />
    </linearGradient>
  </defs>
