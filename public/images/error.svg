          <path d="M-20 -52 V-66" stroke="#aab6cf" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="-20" cy="-68" r="3" fill="#ff8a3d" />
        </g>
        <rect x="-34" y="-28" width="68" height="56" rx="12" fill="url(#suit)" />
        <rect x="-34" y="20" width="68" height="8" rx="4" fill="#aab6cf" />
        <rect x="-20" y="-16" width="40" height="18" rx="4" fill="#141d42" />
        <g transform="translate(-11 -7)">
