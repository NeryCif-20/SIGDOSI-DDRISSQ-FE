          <path class="spark sb" d="M0 3 L-2 12" stroke="#ff8a3d" stroke-width="1.6"
            stroke-linecap="round" fill="none" />
          <circle class="spark sc" cx="6" cy="-9" r="1.4" fill="#ffc857" />
        </g>
        <path d="M-14 -26 L-20 -50" stroke="#aab6cf" stroke-width="4" stroke-linecap="round"
