@if (isLoading()) {
  <div class="flex min-h-screen">
    <hlm-empty>
      <hlm-empty-header>
        <hlm-empty-media variant="icon">
          <hlm-spinner icon="lucideLoader" />
        </hlm-empty-media>
        <span hlmEmptyTitle>Obteniendo información</span>
        <span hlmEmptyDescription class="shimmer">Por favor, espera un momento.</span>
      </hlm-empty-header>
    </hlm-empty>
  </div>
} @else {
  <router-outlet />
}
