@if (refreshMutation.isPending() || refreshMutation.isIdle()) {
  <div class="flex min-h-screen">
    <hlm-empty>
      <hlm-empty-header>
        <hlm-empty-media variant="icon">
          <hlm-spinner icon="lucideLoader" />
        </hlm-empty-media>
        <span hlmEmptyTitle>Obteniendo Información</span>
        <span hlmEmptyDescription class="shimmer">Por favor, espera un momento.</span>
      </hlm-empty-header>
    </hlm-empty>
  </div>
} @else {
  <div class="transition-opacity duration-1000 starting:opacity-0">
    <router-outlet />
    <hlm-toaster position="bottom-center" />
  </div>
}
