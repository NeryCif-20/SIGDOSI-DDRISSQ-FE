<div class="flex flex-col items-center gap-4 p-8">
  <img src="images/error.svg" alt="404" class="w-full max-w-120" />
  <h1 hlmH1>¡Ups! Algo salio mal</h1>
  <p hlmP class="mt-0! max-w-lg">
    Ha ocurrido un error inesperado en la aplicación. Por favor, inténtalo de nuevo más tarde.
  </p>
  @if (url()) {
    <a hlmBtn [routerLink]="url()">
      <ng-icon name="lucideRefreshCw" />
      Reintentar
    </a>
  } @else {
    <a hlmBtn routerLink="/">
      <ng-icon name="lucideHome" />
      Volver al inicio
    </a>
  }
</div>
