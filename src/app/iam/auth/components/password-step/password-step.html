<form class="flex h-full flex-col justify-center gap-4" [formRoot]="loginForm">
  <hlm-field>
    <label hlmFieldLabel for="password">Contraseña</label>
    <sigdosi-password-input
      inputId="password"
      placeholder="••••••••"
      autocomplete="off"
      [formField]="loginForm.password"
    />
    @for (error of loginForm.password().errors(); track error) {
      <hlm-field-error [validator]="error.kind">
        {{ error.message }}
      </hlm-field-error>
    }
  </hlm-field>
  <hlm-field>
    <button hlmBtn [disabled]="loginForm().submitting() || isRequesting()">
      @if (loginForm().submitting()) {
        <hlm-spinner />
      }
      Ingresar
    </button>
    <hlm-field-description class="text-center">
      ¿Olvidaste tu contraseña?
      <button
        hlmBtn
        variant="link"
        class="p-1 text-blue-500"
        type="button"
        [disabled]="loginForm().submitting() || isRequesting()"
        (click)="requestPasswordMail()"
      >
        Restablecer
      </button>
    </hlm-field-description>
  </hlm-field>
</form>
