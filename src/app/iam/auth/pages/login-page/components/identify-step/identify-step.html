<div class="flex h-full flex-col justify-center gap-4">
  <form [formRoot]="identifyForm" id="identifyForm">
    <hlm-field>
      <label hlmFieldLabel for="email">Correo electrónico</label>
      <input
        id="emai"
        hlmInput
        placeholder="nick@example.com"
        autocomplete="off"
        [formField]="identifyForm.email"
        sigdosiAutofocus
      />
      @for (error of identifyForm.email().errors(); track error.kind) {
        <hlm-field-error [validator]="error.kind">
          {{ error.message }}
        </hlm-field-error>
      }
    </hlm-field>
  </form>
  <hlm-field>
    <button hlmBtn form="identifyForm" [disabled]="identifyForm().submitting()">
      @if (identifyForm().submitting()) {
        <hlm-spinner />
      } @else {
        Siguiente
      }
    </button>
  </hlm-field>
</div>
