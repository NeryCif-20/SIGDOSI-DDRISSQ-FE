<div class="flex h-full flex-col justify-center gap-4">
  <form [formRoot]="loginForm" id="loginForm">
    <hlm-field>
      <label hlmFieldLabel for="password">Contraseña</label>
      <sigdosi-password-input
        inputId="password"
        placeholder="••••••••"
        autocomplete="off"
        sigdosiAutofocus
        [formField]="loginForm.password"
      />
      @for (error of loginForm.password().errors(); track error.kind) {
        <hlm-field-error [validator]="error.kind">
          {{ error.message }}
        </hlm-field-error>
      }
    </hlm-field>
  </form>
  <hlm-field>
    <button hlmBtn form="loginForm" [disabled]="loginForm().submitting() || isRequesting()">
      @if (loginForm().submitting()) {
        <hlm-spinner />
      } @else {
        Ingresar
      }
    </button>
    <hlm-field-description class="text-center">
      ¿Olvidaste tu contraseña?
      <button
        hlmBtn
        variant="link"
        class="p-1 text-blue-500"
        type="button"
        [disabled]="loginForm().submitting() || isRequesting()"
        (click)="handleRequestForgotPasswordMail()"
      >
        Restablecer
      </button>
    </hlm-field-description>
  </hlm-field>
</div>
