<hlm-empty>
  <hlm-empty-header>
    <hlm-empty-media variant="icon">
      <ng-icon [name]="statusFeedback().icon" />
    </hlm-empty-media>
    <span hlmEmptyTitle>{{ statusFeedback().title }}</span>
    <span hlmEmptyDescription class="shimmer">{{ statusFeedback().description }}</span>
  </hlm-empty-header>
  @if (authService.passwordTokenStatus() === 'INVALID') {
    <hlm-empty-content>
      <a hlmBtn variant="link" routerLink="/auth" replaceUrl class="text-blue-500">Regresar</a>
    </hlm-empty-content>
  }
</hlm-empty>
