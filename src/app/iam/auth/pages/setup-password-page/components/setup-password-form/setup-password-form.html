<div class="flex min-h-75 flex-col justify-center gap-4">
  <form [formRoot]="setupPasswordForm" id="setupPasswordForm">
    <hlm-field-group class="gap-4">
      <hlm-field>
        <label hlmFieldLabel for="password">Contraseña</label>
        <sigdosi-password-input
          inputId="password"
          placeholder="••••••••"
          autocomplete="off"
          [formField]="setupPasswordForm.newPassword"
        />
        @for (error of setupPasswordForm.newPassword().errors(); track error.kind) {
          <hlm-field-error [validator]="error.kind">
            {{ error.message }}
          </hlm-field-error>
        }
      </hlm-field>
      <hlm-field>
        <label hlmFieldLabel for="confirmPassword">Confirma tu contraseña</label>
        <sigdosi-password-input
          inputId="confirmPassword"
          placeholder="••••••••"
          autocomplete="off"
          [formField]="setupPasswordForm.confirmNewPassword"
        />
        @for (error of setupPasswordForm.confirmNewPassword().errors(); track error.kind) {
          <hlm-field-error [validator]="error.kind">
            {{ error.message }}
          </hlm-field-error>
        }
      </hlm-field>
    </hlm-field-group>
  </form>
  <hlm-field>
    <button hlmBtn form="setupPasswordForm" [disabled]="setupPasswordForm().submitting()">
      @if (setupPasswordForm().submitting()) {
        <hlm-spinner />
      } @else {
        Guardar
      }
    </button>
  </hlm-field>
</div>
