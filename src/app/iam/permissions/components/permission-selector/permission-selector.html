<hlm-dialog>
  <button
    hlmDialogTrigger
    [variant]="readonly() ? 'ghost' : 'default'"
    hlmBtn
    [class]="readonly() ? 'rounded-full' : 'w-full'"
  >
    @if (readonly()) {
      <ng-icon name="lucideEye" />
    } @else {
      {{ openButtonText() }}
    }
  </button>
  <hlm-dialog-content
    *hlmDialogPortal="let context"
    class="w-full sm:min-w-lg"
    [showCloseButton]="false"
  >
    <hlm-dialog-header>
      <h2 hlmDialogTitle>Permisos</h2>
      <p hlmDialogDescription>{{ description() }}</p>
    </hlm-dialog-header>
    <sigdosi-search-input [(value)]="searchTerm" placeholder="Buscar por modulo..." />
    <div class="grid max-h-[60vh] grid-cols-1 gap-4 overflow-y-auto sm:grid-cols-2">
      @for (group of filteredGroups(); track group.module) {
        @let state = deriveState(group);
        <div class="overflow-hidden rounded-lg border">
          <div class="bg-muted/50 flex items-center gap-2 border-b p-4">
            <hlm-checkbox
              [inputId]="group.module"
              [checked]="state === 'all'"
              [indeterminate]="state === 'some'"
              [disabled]="readonly()"
              (checkedChange)="toggleGroup(group)"
            />
            <label [for]="group.module" class="font-bold">{{ group.module | titlecase }}</label>
          </div>
          <div class="flex flex-col gap-2 py-4 pl-10">
            @for (permission of group.permissions; track permission.id) {
              @let id = permission.id;
              <div class="flex items-center gap-2">
                <hlm-checkbox
                  [inputId]="id"
                  [checked]="selectedSet().has(id)"
                  [disabled]="readonly()"
                  (checkedChange)="toggle(id)"
                />
                <label hlmLabel [for]="id">{{ resolveActionLabel(permission.action) }}</label>
              </div>
            } @empty {
              <div
                class="text-muted-foreground col-span-full flex flex-col items-center gap-2 py-8 text-center"
              >
                <ng-icon name="lucideSearchX" class="text-3xl" />
                <p>Sin resultados</p>
              </div>
            }
          </div>
        </div>
      }
    </div>
    <hlm-dialog-footer>
      <button hlmBtn hlmDialogClose>{{ closeButtonText() }}</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
