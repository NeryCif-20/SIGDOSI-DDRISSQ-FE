<hlm-dialog (closed)="searchTerm.set('')">
  <button
    hlmDialogTrigger
    [variant]="readonly() ? 'ghost' : 'default'"
    hlmBtn
    [class]="readonly() ? 'rounded-full' : 'w-full'"
  >
    @if (readonly()) {
      <ng-icon name="lucideEye" />
    } @else {
      {{ openButtonText() }}
    }
  </button>
  <hlm-dialog-content
    *hlmDialogPortal="let context"
    class="w-full sm:min-w-lg"
    [showCloseButton]="false"
  >
    <hlm-dialog-header>
      <h2 hlmDialogTitle>Permisos</h2>
      @if (!readonly()) {
        <p hlmDialogDescription>Marca los permisos que necesitas.</p>
      }
    </hlm-dialog-header>
    <sigdosi-search-input [(value)]="searchTerm" placeholder="Buscar por modulo..." />
    <fieldset hlmFieldSet class="grid max-h-[60vh] grid-cols-1 overflow-y-auto sm:grid-cols-2">
      @for (group of groups(); track group.module) {
        <hlm-field-group class="gap-0 overflow-hidden rounded-lg border">
          <hlm-field orientation="horizontal" class="bg-muted/50 border-b p-4">
            <hlm-checkbox
              [disabled]="readonly()"
              [inputId]="group.module"
              [checked]="group.state === 'all'"
              [indeterminate]="group.state === 'some'"
              (checkedChange)="toggleModule(group.items, $event)"
            />
            <label hlmFieldLabel [for]="group.module" class="truncate">{{ group.module }}</label>
          </hlm-field>
          <div class="flex flex-col gap-2 p-4 pl-11">
            @for (permission of group.items; track permission.id) {
              <hlm-field orientation="horizontal">
                <hlm-checkbox
                  [disabled]="readonly()"
                  [inputId]="permission.id"
                  [checked]="isSelected(permission.id)"
                  (checkedChange)="toggle(permission.id, $event)"
                />
                <label hlmFieldLabel [for]="permission.id">{{
                  getActionLabel(permission.action)
                }}</label>
              </hlm-field>
            }
          </div>
        </hlm-field-group>
      } @empty {
        <div
          class="text-muted-foreground col-span-full flex flex-col items-center gap-2 py-8 text-center"
        >
          <ng-icon name="lucideSearchX" class="text-3xl" />
          <p>Sin resultados.</p>
        </div>
      }
    </fieldset>
    <hlm-dialog-footer>
      <button hlmBtn hlmDialogClose>{{ closeButtonText() }}</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
