<div class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-12">
  <sigdosi-search-input
    class="sm:col-span-4"
    placeholder="Buscar por módulo..."
    [(value)]="searchTerm"
  />
  <hlm-combobox-multiple
    class="sm:col-span-5"
    [(value)]="selectedActions"
    [itemToString]="getActionLabel"
    autoHighlight
  >
    <hlm-combobox-chips>
      <ng-template hlmComboboxValues let-values>
        @for (value of values; track value) {
          <hlm-combobox-chip [value]="value">{{ getActionLabel(value) }}</hlm-combobox-chip>
        }
      </ng-template>
      <input hlmComboboxChipInput placeholder="Agregar acciones..." />
    </hlm-combobox-chips>
    <hlm-combobox-content *hlmComboboxPortal>
      <hlm-combobox-empty>No se encontraron acciones</hlm-combobox-empty>
      <div hlmComboboxList>
        @for (option of options; track option.value) {
          <hlm-combobox-item [value]="option.value">
            {{ option.label }}
          </hlm-combobox-item>
        }
      </div>
    </hlm-combobox-content>
  </hlm-combobox-multiple>
  <button hlmBtn variant="secondary" class="sm:col-span-2" (click)="cleanFilters.emit()">
    <ng-icon name="lucideFilterX" />
    Limpiar filtros
  </button>
</div>
