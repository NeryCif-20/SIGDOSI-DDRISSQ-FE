<div class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
  <sigdosi-search-input placeholder="Busca por módulo..." (valueChange)="updateQ($event)" />
  <hlm-select (valueChange)="updateAction($event)" [itemToString]="actionToString">
    <hlm-select-trigger class="w-full sm:w-1/2">
      <hlm-select-value placeholder="Acción" />
    </hlm-select-trigger>
    <hlm-select-content *hlmSelectPortal>
      <hlm-select-group>
        <hlm-select-item [value]="null">Ninguno</hlm-select-item>
        @for (option of options; track option.value) {
          <hlm-select-item [value]="option.value">{{ option.label }}</hlm-select-item>
        }
      </hlm-select-group>
    </hlm-select-content>
  </hlm-select>
</div>
