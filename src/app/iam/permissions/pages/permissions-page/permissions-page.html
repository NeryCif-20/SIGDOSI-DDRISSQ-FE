<sigdosi-permissions-header />
<sigdosi-permissions-filters
  [searchTerm]="filters().search"
  [selectedActions]="filters().actions"
  (searchTermChange)="setSearch($event)"
  (selectedActionsChange)="setActions($event)"
  (cleanFilters)="onCleanFilters()"
/>
<sigdosi-permissions-table
  [data]="query.data()!.content"
  [sortValues]="filters().sort"
  (sortValuesChange)="setSort($event)"
/>
<sigdosi-pagination
  [currentPage]="filters().page"
  [elementsPerPage]="filters().size"
  [totalElements]="query.data()!.totalElements"
  [pageSizes]="pageSizes"
  (currentPageChange)="setPage($event)"
  (elementsPerPageChange)="setSize($event)"
/>
