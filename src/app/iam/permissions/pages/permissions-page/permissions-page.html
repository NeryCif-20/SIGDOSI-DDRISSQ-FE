<sigdosi-permissions-header />
<sigdosi-permissions-filters
  [searchTerm]="filters().search"
  [selectedActions]="filters().actions"
  (searchTermChange)="onSearchTermChange($event)"
  (selectedActionsChange)="onSelectedActionsChange($event)"
  (cleanFilters)="onCleanFilters()"
/>
<sigdosi-permissions-table
  [data]="response().content"
  [sortValues]="filters().sort"
  (sortValuesChange)="onSortValuesChange($event)"
/>
<sigdosi-pagination
  [currentPage]="filters().page"
  [elementsPerPage]="filters().size"
  [totalElements]="response().totalElements"
  [pageSizes]="pageSizes"
  (currentPageChange)="onCurrentPageChange($event)"
  (elementsPerPageChange)="onElementsPerPageChange($event)"
/>
