<hlm-dialog-header>
  <h3 hlmDialogTitle>{{ header().title }}</h3>
  <p hlmDialogDescription>
    {{ header().description }}
  </p>
</hlm-dialog-header>
@if (action() !== 'delete') {
  <form [formRoot]="roleForm" id="roleForm">
    <hlm-field-group class="mb-4 gap-4">
      <hlm-field>
        <label hlmFieldLabel for="name">Nombre</label>
        <input hlmInput id="name" placeholder="Administrador..." [formField]="roleForm.name" />
        @for (error of roleForm.name().errors(); track error.kind) {
          <hlm-field-error [validator]="error.kind">
            {{ error.message }}
          </hlm-field-error>
        }
      </hlm-field>
      <hlm-field>
        <label hlmFieldLabel for="description">Descripción</label>
        <textarea
          hlmTextarea
          class="max-h-40 overflow-y-auto"
          id="description"
          placeholder="Describe el rol..."
          [formField]="roleForm.description"
        ></textarea>
      </hlm-field>
    </hlm-field-group>
    <sigdosi-permission-selector
      [openButtonText]="`${action() === 'create' ? 'Agregar' : 'Modificar'} permisos...`"
      (selectedIdsChange)="onSelectedIdsChange($event)"
    />
  </form>
}
<hlm-dialog-footer>
  <button
    hlmBtn
    variant="outline"
    [disabled]="deleteMutation.isPending() || deleteMutation.isSuccess() || roleForm().submitting()"
    hlmDialogClose
  >
    Cancelar
  </button>
  @if (action() === 'delete') {
    <button
      hlmBtn
      variant="destructive"
      [disabled]="deleteMutation.isPending() || deleteMutation.isSuccess()"
      (click)="deleteMutation.mutate()"
    >
      @if (isBusy()) {
        <hlm-spinner />
      } @else {
        Eliminar
      }
    </button>
  } @else {
    <button hlmBtn form="roleForm" [disabled]="roleForm().submitting()">
      @if (roleForm().submitting()) {
        <hlm-spinner />
      } @else {
        Guardar
      }
    </button>
  }
</hlm-dialog-footer>
