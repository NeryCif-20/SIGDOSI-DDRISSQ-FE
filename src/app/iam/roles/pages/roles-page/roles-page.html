<sigdosi-roles-header />
<sigdosi-roles-filters
  [searchTerm]="filters().search"
  (searchTermChange)="onSearchTermChange($event)"
  [selectedPermissions]="filters().permissions"
  (selectedPermissionsChange)="onSelectedPermissionsChange($event)"
/>
<sigdosi-roles-table
  [data]="query.data()!.content"
  [sortValues]="filters().sort"
  (sortValuesChange)="onSortValuesChange($event)"
/>
<sigdosi-pagination
  [totalElements]="query.data()!.totalElements"
  [currentPage]="filters().page"
  [elementsPerPage]="filters().size"
  [pageSizes]="pageSizes"
  (currentPageChange)="onCurrentPageChange($event)"
  (elementsPerPageChange)="onElementsPerPageChange($event)"
/>
