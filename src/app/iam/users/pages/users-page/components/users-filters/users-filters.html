<div class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-7">
  <sigdosi-search-input
    class="sm:col-span-2"
    placeholder="Buscar por nombre, cui, correo o teléfono..."
    [(value)]="searchTerm"
  />
  <hlm-combobox-multiple
    class="sm:col-span-2"
    [(value)]="selectedStatuses"
    [itemToString]="getStatusLabel"
    autoHighlight
  >
    <hlm-combobox-chips>
      <ng-template hlmComboboxValues let-values>
        @for (value of values; track value) {
          <hlm-combobox-chip [value]="value">{{ getStatusLabel(value) }}</hlm-combobox-chip>
        }
      </ng-template>
      <input hlmComboboxChipInput placeholder="Buscar por estados..." />
    </hlm-combobox-chips>
    <hlm-combobox-content *hlmComboboxPortal>
      <hlm-combobox-empty>No se encontraron acciones</hlm-combobox-empty>
      <div hlmComboboxList>
        @for (option of options; track option.value) {
          <hlm-combobox-item [value]="option.value">
            {{ option.label }}
          </hlm-combobox-item>
        }
      </div>
    </hlm-combobox-content>
  </hlm-combobox-multiple>
  <sigdosi-role-selector class="sm:col-span-2" [(selectedRoles)]="selectedRoles" />
  <button hlmBtn variant="secondary" (click)="cleanFilters.emit()">
    <ng-icon name="lucideFilterX" />
    Limpiar filtros
  </button>
</div>
