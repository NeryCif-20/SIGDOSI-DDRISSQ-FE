<header class="bg-background sticky top-0 z-50 flex w-full items-center border-b">
  <div class="flex h-(--header-height) w-full items-center gap-2 p-4">
    <button class="rounded-full" hlmSidebarTrigger><span class="sr-only"></span></button>
    <hlm-separator orientation="vertical" class="mr-2" />
    <sigdosi-main-breadcrumb class="hidden flex-1 sm:block" />
    <div class="flex flex-1 items-center justify-center sm:hidden">
      <a hlmBtn variant="ghost" routerLink="/" class="h-auto p-2">
        <img src="icons/favicon.svg" alt="Logo" class="size-8" />
        <span class="sr-only">Ir al inicio</span>
      </a>
    </div>
    <hlm-separator orientation="vertical" class="ml-2" />
    <sigdosi-theme-selector />
    <hlm-separator orientation="vertical" class="mr-2" />
    @if (true) {
      <sigdosi-user-menu />
    } @else {
      <a hlmBtn variant="ghost" routerLink="/">
        <ng-icon name="lucideLogIn" />
        Inicia Sesión
      </a>
    }
  </div>
</header>
