<hlm-input-group>
  <input
    hlmInputGroupInput
    [id]="inputId()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [autocomplete]="autocomplete()"
    [type]="_inputType()"
    (input)="value.set($event.target.value)"
    (blur)="touch.emit(true)"
  />
  <hlm-input-group-addon align="inline-end">
    <button hlmInputGroupButton size="icon-xs" type="button" (click)="toggleVisibility()">
      <ng-icon [name]="_icon()" />
      <span class="sr-only">Alternar visibilidad de la contraseña</span>
    </button>
  </hlm-input-group-addon>
</hlm-input-group>
