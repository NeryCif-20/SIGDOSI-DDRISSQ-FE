<hlm-input-group>
  <input
    #search
    hlmInputGroupInput
    [placeholder]="placeholder()"
    [value]="searchTerm() ?? ''"
    (input)="searchTerm.set(search.value)"
  />
  <hlm-input-group-addon>
    <ng-icon name="lucideSearch" />
  </hlm-input-group-addon>
  @if (searchTerm()) {
    <hlm-input-group-addon align="inline-end">
      <button hlmInputGroupButton variant="ghost" size="icon-xs" (click)="searchTerm.set('')">
        <span class="sr-only">Limpiar</span>
        <ng-icon name="lucideX" />
      </button>
    </hlm-input-group-addon>
  }
</hlm-input-group>
