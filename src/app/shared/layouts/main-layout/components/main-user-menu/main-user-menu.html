<button
  hlmBtn
  variant="ghost"
  [hlmDropdownMenuTrigger]="userMenu"
  align="end"
  class="group rounded-full"
>
  <sigdosi-user-avatar [avatar]="user()!.avatar" [fallback]="user()! | fullName" />
  <ng-icon
    name="lucideChevronDown"
    class="transition-transform duration-150 group-aria-expanded:rotate-180"
  />
</button>

<ng-template #userMenu>
  <hlm-dropdown-menu>
    <hlm-dropdown-menu-group>
      <hlm-dropdown-menu-label>
        <div class="flex flex-col items-center gap-1">
          <sigdosi-user-avatar
            [avatar]="user()!.avatar"
            [fallback]="user()! | fullName"
            classes="my-2 size-16 [&_[hlmAvatarFallback]]:text-3xl"
          />
          <div class="flex flex-1 flex-col items-center gap-2">
            <span>{{ user()! | fullName }}</span>
            <span class="shimmer">{{ user()!.email }}</span>
            <span
              hlmBadge
              class="bg-green-50 text-green-700 dark:bg-green-950 dark:text-green-300"
              >{{ user()!.role.name }}</span
            >
          </div>
        </div>
      </hlm-dropdown-menu-label>
      <hlm-dropdown-menu-separator />
      <button hlmDropdownMenuItem class="gap-4">
        <ng-icon name="lucideCircleUser" />
        Mi cuenta
      </button>
      <hlm-dropdown-menu-separator />
      <button
        variant="destructive"
        hlmDropdownMenuItem
        class="gap-4"
        (click)="logoutMutation.mutate()"
      >
        <ng-icon name="lucideLogOut" />
        Cerrar sesión
      </button>
    </hlm-dropdown-menu-group>
  </hlm-dropdown-menu>
</ng-template>
